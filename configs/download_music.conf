# Einzel-Download Musik – yt-dlp Config (benötigt ffmpeg)
# Ausgabeordner und -o werden vom Downloader-Modul gesetzt (config.json -> downloads.musicDirectory).

-f "ba/b"
-x
--audio-format mp3
--audio-quality 0
--embed-metadata
--embed-thumbnail
--convert-thumbnails jpg
--socket-timeout 60
--retries 10
--fragment-retries 10
#--restrict-filenames
#--no-playlist
#--cookies-from-browser firefox
