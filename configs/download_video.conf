# Einzel-Download Video – yt-dlp Config
# Ausgabeordner und -o werden vom Downloader-Modul gesetzt (config.json -> downloads.videoDirectory).

-f "bv*+ba/b"
-S ext:mp4:m4a
--merge-output-format mp4
--embed-metadata
--embed-thumbnail
-N 4
--socket-timeout 60
--retries 10
--fragment-retries 10
#--restrict-filenames
#--no-playlist
#--cookies-from-browser firefox
#--write-subs --sub-langs "de,en" --embed-subs
